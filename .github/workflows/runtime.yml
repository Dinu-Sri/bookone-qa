name: Isolated PostgreSQL lifecycle and isolation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bookone_qa_runtime
          POSTGRES_USER: qa_fixture_admin
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      QA_RUNTIME_ADMIN_URL: postgres://qa_fixture_admin:ephemeral-ci-only@127.0.0.1:5432/bookone_qa_runtime
      QA_RUNTIME_ISOLATION: ephemeral-local-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:runtime-guard
      - run: pnpm matrix:check
      - run: pnpm product:prepare
      - run: pnpm runtime:prepare
      - run: pnpm runtime:run
      - name: Preserve sanitized summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-postgres-summary
          path: runs/*-runtime.json
          if-no-files-found: error
          retention-days: 30
