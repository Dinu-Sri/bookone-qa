name: Mission2 actual payment field component contracts
on:
  pull_request:
    paths:
      - product-ref.json
      - tests/components/**
      - vitest.mission2-components.config.ts
      - .github/workflows/mission2-components.yml
permissions:
  contents: read
jobs:
  component-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm product:prepare
      - run: pnpm exec vitest run --config vitest.mission2-components.config.ts
