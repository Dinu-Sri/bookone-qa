name: Full coordinated QA campaign
on:
  workflow_dispatch:
  pull_request:
    paths:
      - campaigns/**
      - scripts/campaign/**
      - tests/runtime/**
      - tests/infrastructure/campaign-state.test.mjs
      - batches/runtime.json
      - product-ref.json
      - .github/workflows/full-campaign.yml
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bookone_qa_runtime
          POSTGRES_USER: qa_fixture_admin
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      QA_RUNTIME_ISOLATION: ephemeral-local-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm product:prepare
      - run: node scripts/runtime/ci-target.mjs
      - name: All implemented checks; missing workflows cannot pass
        run: pnpm campaign:run --seed 261013 --profile quick --jobs 2
      - name: Preserve allowlisted campaign and child summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-campaign-sanitized
          path: |
            .local/campaigns/*/summary.json
            .local/campaigns/*/*-summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      # State, credentials, raw logs, archive bytes and auth data never uploaded.
