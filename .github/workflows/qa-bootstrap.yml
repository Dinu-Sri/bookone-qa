name: QA repository validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm product:prepare
      - run: pnpm rulebook:check
      - run: pnpm test:sensitivity
      - run: pnpm test:unit
      - run: pnpm test:e2e:list
      - name: Clarify evidence scope
        run: echo 'Unit checks and browser-test discovery only. Staging business acceptance and product release gate are not established.'
